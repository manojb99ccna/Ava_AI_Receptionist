name: ava-ai

services:
  db:
    image: mysql:8.0
    container_name: ava-ai-db
    # Native password auth so older clients (XAMPP, HeidiSQL, Navicat) can connect
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: ava_ai
      MYSQL_USER: ava
      MYSQL_PASSWORD: ava_secret
    ports:
      - "3325:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uava", "-pava_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ava-ai-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8320:80"
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ava-ai-backend
    env_file: ./backend/.env
    ports:
      - "8310:8000"
    volumes:
      - ./backend:/app
      - /app/venv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ava-ai-frontend
    environment:
      - API_TARGET=http://backend:8000
    ports:
      - "5180:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
